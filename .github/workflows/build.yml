name: Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Rebuild a ref on demand (e.g. to restore the published image after a bad push).
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.21.1
      with:
        node-version: "24"
        cache: true

    - name: Install dependencies
      run: vp install

    - name: Build
      run: vp run -r build

    - name: Check types
      run: vp run -w check-types
      continue-on-error: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # Publishing is limited to non-PR events. A pull request must never move the
    # `latest` tag: that tag is what the production deployment pulls, so a PR
    # build would ship unreleased code to production.
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    # Build on PRs too (without pushing) so Dockerfile regressions are caught
    # before merge. Publishing to `latest` stays limited to non-PR events; a PR
    # build must never move that tag, since production pulls it.
    - name: Build image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/server/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository_owner }}/tallyo:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
